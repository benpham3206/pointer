# CI template — Python project
# Copy to <project>/.github/workflows/ci.yml at STAGE 2 (not release).
# Gate rules: every step here hard-fails. Optional/advisory checks go in a
# separately named non-gating job — never described as gate evidence.
# Stage 2 setup: pin actions to reviewed commit SHAs (security checklist);
# the @vN tags below are placeholders to pin, not a policy.

name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4        # PIN to SHA at Stage 2
      - uses: astral-sh/setup-uv@v4      # PIN to SHA at Stage 2
      - name: Refuse unpinned actions
        run: |
          ! grep -q 'PIN to SHA' .github/workflows/*.yml || {
            echo "actions not yet pinned to commit SHAs (Stage 2 incomplete)"; exit 1; }
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --all-extras
      - name: Lint & format check
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy .
      - name: Test (zero collected tests = failure)
        run: uv run pytest -q
